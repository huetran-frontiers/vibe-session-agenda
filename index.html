<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const PHOTOS = DATA.photos;
const SESSIONS = DATA.sessions;
const TAGS = ['All','RTM','DEO','AHM','Service Layer','JANE'];
let activeTag = 'All';
let query = '';

const tagClass = t => t==='Service Layer' ? 'Service' : (['RTM','DEO','AHM','JANE'].includes(t) ? t : (t==='Other'?'Other':'Other'));
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function buildFilters(){
  const f = document.getElementById('filters');
  f.innerHTML = '';
  TAGS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'chip' + (t===activeTag?' active':'');
    b.textContent = t;
    b.onclick = () => { activeTag = t; render(); };
    f.appendChild(b);
  });
}

function itemMatchesTag(it){
  if(activeTag==='All') return true;
  return it.tags.includes(activeTag);
}
function itemMatchesQuery(it){
  if(!query) return true;
  const q = query.toLowerCase();
  if(it.text.toLowerCase().includes(q)) return true;
  return it.presenters.some(p => p.toLowerCase().includes(q));
}

function render(){
  buildFilters();
  const app = document.getElementById('app');
  app.innerHTML = '';
  const byMonth = {};
  SESSIONS.forEach(s => {
    const items = s.items.filter(it => itemMatchesTag(it) && itemMatchesQuery(it));
    if(!items.length) return;
    const d = new Date(s.date + 'T00:00:00');
    const key = d.getFullYear()+'-'+d.getMonth();
    (byMonth[key] = byMonth[key] || {label: MONTHS[d.getMonth()]+' '+d.getFullYear(), sessions:[]}).sessions.push({s, items, d});
  });
  const keys = Object.keys(byMonth).sort((a,b)=>{const[ay,am]=a.split('-').map(Number);const[by,bm]=b.split('-').map(Number);return ay-by||am-bm;});
  if(!keys.length){ app.innerHTML = '<div class="empty">No sessions match your filters.</div>'; return; }
  keys.forEach(k => {
    const m = byMonth[k];
    const mDiv = document.createElement('div');
    mDiv.className = 'month';
    const cnt = m.sessions.reduce((a,x)=>a+x.items.length,0);
    mDiv.innerHTML = '<div class="month-head"><span class="caret">▼</span><h2>'+m.label+'</h2><span class="month-count">'+cnt+' item'+(cnt>1?'s':'')+'</span></div><div class="month-body"></div>';
    const head = mDiv.querySelector('.month-head');
    head.onclick = () => mDiv.classList.toggle('collapsed');
    const mb = mDiv.querySelector('.month-body');
    m.sessions.forEach(({s, items, d}) => mb.appendChild(card(s, items, d)));
    app.appendChild(mDiv);
  });
}

function card(s, items, d){
  const c = document.createElement('div');
  c.className = 'card';
  const dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  const mon = MONTHS[d.getMonth()].slice(0,3);
  let flags = '';
  if(s.is_adhoc) flags += '<span class="flag adhoc">Ad-hoc</span>';
  if(s.is_2hour) flags += '<span class="flag twohr">2h</span>';
  let html = '<div class="datebadge"><div class="dow">'+dow+'</div><div class="day">'+d.getDate()+'</div><div class="mon">'+mon+'</div></div>';
  const tl = s.time_label ? '<span class="when">'+esc(s.time_label)+'</span>' : '';
  html += '<div class="card-main"><div class="meeting">'+esc(s.meeting_name)+tl+flags+'</div>';
  items.forEach(it => {
    const tags = it.tags.map(t => '<span class="tag '+tagClass(t)+'">'+esc(t)+'</span>').join('');
    const q = query.toLowerCase();
    const titleMatch = q && it.text.toLowerCase().includes(q);
    const avs = it.presenters.map(p => {
      const pm = q && p.toLowerCase().includes(q);
      const src = PHOTOS[p] || '';
      return '<span class="avwrap'+(pm?' glow':'')+'"><img src="'+src+'" alt="'+esc(p)+'"><span class="tip">'+esc(p)+'</span></span>';
    }).join('');
    html += '<div class="item"><div class="tagcol">'+tags+'</div><div class="item-body"><div class="title'+(titleMatch?' match':'')+'">'+esc(it.text)+'</div><div class="avatars">'+avs+'</div></div></div>';
  });
  html += '</div>';
  c.innerHTML = html;
  return c;
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.getElementById('search').addEventListener('input', e => { query = e.target.value.trim(); render(); });
render();
</script>
