function safeClass(s){return s.replace(/[^a-z0-9]+/gi,'-')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function monthName(d){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'})}
FILTERS.forEach(f=>{const b=document.createElement('button');b.className='filter'+(f==='All'?' active':'');b.textContent=f;b.onclick=()=>{active=f;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.textContent===f));render()};filters.appendChild(b)});search.addEventListener('input',render);
function render(){const q=search.value.trim().toLowerCase();const months=new Map();for(const s of DATA.sessions){const items=s.items.filter(it=>(active==='All'||it.tags.includes(active))&&(!q||(it.text+' '+it.presenters.join(' ')).toLowerCase().includes(q)));if(!items.length)continue;const m=monthName(s.date);if(!months.has(m))months.set(m,[]);months.get(m).push({...s,items})}content.innerHTML='';if(!months.size){content.innerHTML='<div class="empty">No matching sessions.</div>';return}for(const [m,sessions] of months){const section=document.createElement('section');section.className='month';const head=document.createElement('button');head.className='monthhead';head.innerHTML='<span>'+esc(m)+'</span><span>'+sessions.length+' session'+(sessions.length===1?'':'s')+'　⌄</span>';const cards=document.createElement('div');cards.className='cards';head.onclick=()=>{cards.hidden=!cards.hidden;head.lastElementChild.textContent=sessions.length+' session'+(sessions.length===1?'':'s')+(cards.hidden?'　›':'　⌄')};for(const s of sessions){const d=new Date(s.date+'T12:00:00');const day=d.toLocaleDateString(undefined,{weekday:'short'}),mon=d.toLocaleDateString(undefined,{month:'short'});const card=document.createElement('article');card.className='card';const flags=(s.is_adhoc?'<span class="badge adhoc">Ad-hoc</span>':'')+(s.is_2hour?'<span class="badge two">2h</span>':'');const tagList=[...new Set(s.items.flatMap(x=>x.tags))];card.innerHTML='<div class="datebox"><span class="dow">'+esc(day)+'</span><span class="day">'+d.getDate()+'</span><span class="mon">'+esc(mon)+'</span><div class="badges">'+flags+'</div></div><div class="tags">'+tagList.map(t=>'<span class="tag tag-'+safeClass(t)+'">'+esc(t)+'</span>').join('')+'</div><div class="items">'+(s.meeting_name?'<p class="meeting">'+esc(s.meeting_name)+'</p>':'')+s.items.map(it=>'<div class="item"><span class="title">'+esc(it.text)+'</span><span class="avatars">'+it.presenters.map(p=>'<img class="avatar '+(q&&(it.text+' '+p).toLowerCase().includes(q)?'glow':'')+'" src="'+DATA.photos[p]+'" alt="'+esc(p)+'" title="'+esc(p)+'">').join('')+'</span></div>').join('')+'</div>';cards.appendChild(card)}section.append(head,cards);content.appendChild(section)}}render();</script></body></html>
