const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let currentFilter = 'All';
let currentSearch = '';

function tagClass(t){ return 'tag tag-' + t.replace(/ /g,'-'); }

function render(){
  const root = document.getElementById('root');
  const q = currentSearch.toLowerCase();
  const groups = {};
  for (const s of SESSIONS){
    const visibleItems = s.items.filter(it => {
      if (currentFilter !== 'All' && !it.tags.includes(currentFilter)) return false;
      return true;
    });
    if (!visibleItems.length) continue;
    const d = new Date(s.date + 'T00:00:00');
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    if (!groups[key]) groups[key] = { label: MONTHS[d.getMonth()] + ' ' + d.getFullYear(), sessions: [] };
    groups[key].sessions.push({...s, items: visibleItems, _d: d});
  }
  const keys = Object.keys(groups).sort();
  if (!keys.length){ root.innerHTML = '<div class="empty">No sessions match.</div>'; return; }
  let html = '';
  for (const k of keys){
    const g = groups[k];
    html += '<div class="month"><div class="month-h" onclick="this.parentNode.classList.toggle(\'collapsed\')">' + g.label + ' (' + g.sessions.length + ')</div><div class="sessions">';
    for (const s of g.sessions){
      const d = s._d;
      const adhoc = s.is_adhoc ? '<span class="badge badge-adhoc">Ad-hoc</span>' : '';
      const twoh  = s.is_2hour ? '<span class="badge badge-2h">2h</span>' : '';
      // collect unique tags across visible items
      const tagSet = new Set();
      for (const it of s.items) it.tags.forEach(t => tagSet.add(t));
      const tagsHtml = [...tagSet].map(t => '<span class="' + tagClass(t) + '">' + t + '</span>').join('');
      html += '<div class="session">'
           + '<div class="date-badge"><div class="d">' + d.getDate() + '</div><div class="m">' + MONTHS[d.getMonth()] + '</div><div class="dow">' + DOWS[d.getDay()] + '</div></div>'
           + '<div class="tags-col">' + tagsHtml + '</div>'
           + '<div class="session-body">'
           + '<div class="meeting-name">' + escapeHtml(s.meeting_name) + ' ' + adhoc + ' ' + twoh + '</div>';
      for (const it of s.items){
        const presHtml = it.presenters.map(p => {
          const src = PHOTOS[p] || '';
          return '<div class="avatar" data-name="' + escapeHtml(p) + '" style="background-image:url(\'' + src + '\')"></div>';
        }).join('');
        const presText = it.presenters.join(' ').toLowerCase();
        const matches = q && (it.text.toLowerCase().includes(q) || presText.includes(q));
        html += '<div class="item' + (matches ? ' glow' : '') + '"><div class="title">' + escapeHtml(it.text) + '</div><div class="avatars">' + presHtml + '</div></div>';
      }
      html += '</div></div>';
    }
    html += '</div></div>';
  }
  root.innerHTML = html;
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

document.querySelectorAll('.pill').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.f;
  render();
}));
document.getElementById('q').addEventListener('input', e => { currentSearch = e.target.value; render(); });
