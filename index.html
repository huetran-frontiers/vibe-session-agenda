:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.header{background:#003BDE;color:white;padding:22px max(24px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:18px}.header h1{font-size:25px;margin:0}.edit{color:#003BDE;background:white;text-decoration:none;font-size:13px;font-weight:700;padding:9px 13px;border-radius:8px;white-space:nowrap}.wrap{max-width:1100px;margin:auto;padding:22px 20px 60px}.source{background:#eaf0ff;border:1px solid #cbd8ff;border-radius:10px;padding:12px 15px;font-size:13px;color:#25345b;margin-bottom:16px}.filters{position:sticky;top:0;z-index:5;background:#f5f7fb;padding:12px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filters button{border:1px solid #d4dbea;background:white;color:#35415a;border-radius:20px;padding:8px 14px;font-weight:650;cursor:pointer}.filters button.active{background:#003BDE;color:white;border-color:#003BDE}.filters input{margin-left:auto;min-width:200px;border:1px solid #d4dbea;border-radius:9px;padding:9px 12px;font-size:14px}.month{margin-top:20px}.month-toggle{border:0;background:none;padding:8px 2px;font-size:19px;font-weight:750;cursor:pointer;color:#172033}.month-toggle:before{content:'▾';display:inline-block;width:22px;color:#003BDE}.month.closed .month-toggle:before{content:'▸'}.month.closed .month-content{display:none}.session{background:white;border:1px solid #e1e6ef;border-radius:12px;margin:10px 0;box-shadow:0 2px 7px #16233c0a;overflow:hidden}.session-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fafbfe;border-bottom:1px solid #edf0f5}.date{font-weight:750;color:#18233a}.meet{color:#667085;font-size:13px}.badge{font-size:11px;font-weight:750;background:#fff3d6;color:#8a5a00;border-radius:20px;padding:4px 8px}.badge.two{background:#e8f2ff;color:#1657a5}.items{padding:3px 16px}.item{display:flex;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid #f0f2f6}.item:last-child{border-bottom:0}.tags{flex:0 0 110px;display:flex;flex-wrap:wrap;gap:5px}.tag{font-size:10px;font-weight:750;letter-spacing:.02em;border-radius:12px;padding:4px 7px;background:#edf1f8;color:#46536b}.tag.rtm{background:#e8efff;color:#1748c7}.tag.deo{background:#e9f7f0;color:#18734d}.tag.ahm{background:#fff1e8;color:#a74b13}.tag.service-layer{background:#f3eaff;color:#7041a6}.tag.jane{background:#fff0f6;color:#a6376d}.content{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;flex:1;min-width:0}.title{flex:1 1 320px;line-height:1.45;overflow-wrap:anywhere}.avatars{display:flex;flex:0 0 auto;gap:5px;flex-wrap:wrap}.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid #e2e7f0;transition:box-shadow .15s}.avatar:hover{box-shadow:0 0 0 3px #8fa8ff}.item.match .avatar{box-shadow:0 0 0 3px #91adff}.empty{padding:35px;text-align:center;color:#667085}.footer{font-size:12px;color:#778198;margin-top:28px;text-align:center}@media(max-width:620px){.header{padding:18px 16px}.header h1{font-size:21px}.wrap{padding:15px 12px 40px}.filters input{margin-left:0;flex:1}.item{gap:8px}.tags{flex-basis:75px}.title{flex-basis:100%}.session-head{flex-wrap:wrap}}
</style></head><body><header class="header"><h1>Vibe Session Agenda</h1><a class="edit" href="https://confluence.frontiersin.net/pages/viewpage.action?pageId=637566996" target="_blank" rel="noopener">Edit on Confluence ↗</a></header><main class="wrap"><div class="source"><strong>Source of truth:</strong> Confluence agenda. This page syncs each morning. Open Confluence to make changes.</div><nav class="filters" id="filters"><button class="active" data-filter="All">All</button><button data-filter="RTM">RTM</button><button data-filter="DEO">DEO</button><button data-filter="AHM">AHM</button><button data-filter="Service Layer">Service Layer</button><button data-filter="JANE">JANE</button><input id="search" type="search" placeholder="Search sessions and presenters…" aria-label="Search sessions"></nav><div id="agenda"></div><div class="footer">Synced from Confluence</div></main><script>const DATA={"sessions": [], "photos": {}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let filter='All',query='';const root=document.getElementById('agenda');
function tagClass(t){return t.toLowerCase().replace(/[^a-z0-9]+/g,'-')}
function render(){let groups={};for(const s of DATA.sessions){let d=new Date(s.date+'T12:00:00');let m=d.toLocaleDateString('en-US',{month:'long',year:'numeric'});(groups[m]??=[]).push(s)}let out='';for(const [month,sessions] of Object.entries(groups)){let cards='';for(const s of sessions){let items=s.items.filter(it=>{let text=(it.text+' '+it.presenters.join(' ')).toLowerCase();return (filter==='All'||it.tags.includes(filter))&&(!query||text.includes(query))});if(!items.length)continue;let d=new Date(s.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});cards+=`<article class="session"><div class="session-head"><span class="date">${esc(d)}</span><span class="meet">${esc(s.meeting_name)}</span>${s.is_adhoc?'<span class="badge">Ad-hoc</span>':''}${s.is_2hour?'<span class="badge two">2h</span>':''}</div><div class="items">${items.map(it=>`<div class="item ${query?'match':''}"><div class="tags">${it.tags.map(t=>`<span class="tag ${tagClass(t)}">${esc(t)}</span>`).join('')}</div><div class="content"><span class="title">${esc(it.text)}</span><div class="avatars">${it.presenters.map(n=>`<img class="avatar" src="${DATA.photos[n]||''}" alt="${esc(n)}" title="${esc(n)}" loading="lazy">`).join('')}</div></div></div>`).join('')}</div></article>`}if(cards)out+=`<section class="month"><button class="month-toggle" aria-expanded="true">${esc(month)}</button><div class="month-content">${cards}</div></section>`}root.innerHTML=out||'<div class="empty">No sessions match this filter.</div>';document.querySelectorAll('.month-toggle').forEach(b=>b.onclick=()=>{let p=b.parentElement;p.classList.toggle('closed');b.setAttribute('aria-expanded',String(!p.classList.contains('closed')))});}
document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{document.querySelector('#filters .active').classList.remove('active');b.classList.add('active');filter=b.dataset.filter;render()});document.getElementById('search').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};render();
</script></body></html>
