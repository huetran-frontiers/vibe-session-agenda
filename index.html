<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:#f9fafb; color:#111827; }
  header { background:#003BDE; color:#fff; padding:20px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  header h1 { margin:0; font-size:20px; font-weight:700; }
  header .sub { font-size:13px; opacity:0.85; margin-top:4px; }
  .edit-btn { background:#fff; color:#003BDE; text-decoration:none; padding:8px 14px; border-radius:8px; font-weight:600; font-size:13px; white-space:nowrap; }
  .edit-btn:hover { background:#e5edff; }
  .banner { background:#fff7ed; border-bottom:1px solid #fed7aa; color:#9a3412; font-size:12.5px; padding:8px 24px; }
  .filterbar { position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid #e5e7eb; padding:10px 24px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .filterbar input[type=text] { flex:1 1 200px; padding:8px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:13px; }
  .chip { padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:600; border:1px solid #d1d5db; background:#fff; cursor:pointer; color:#374151; }
  .chip.active { background:#003BDE; color:#fff; border-color:#003BDE; }
  main { max-width:900px; margin:0 auto; padding:20px 16px 60px; }
  .month-group { margin-bottom:18px; }
  .month-header { font-size:14px; font-weight:700; color:#374151; padding:8px 4px; cursor:pointer; display:flex; align-items:center; gap:8px; user-select:none; }
  .month-header .chev { transition:transform .15s; }
  .month-header.collapsed .chev { transform:rotate(-90deg); }
  .month-body { display:block; }
  .month-body.collapsed { display:none; }
  .card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; margin-bottom:10px; padding:14px 16px; display:flex; gap:14px; }
  .date-badge { flex:0 0 64px; text-align:center; }
  .date-badge .dow { font-size:11px; color:#6b7280; font-weight:600; text-transform:uppercase; }
  .date-badge .dom { font-size:20px; font-weight:700; color:#003BDE; }
  .badges-row { display:flex; gap:4px; flex-wrap:wrap; justify-content:center; margin-top:4px; }
  .mini-badge { font-size:9.5px; font-weight:700; padding:2px 5px; border-radius:5px; color:#fff; white-space:nowrap; }
  .mini-badge.adhoc { background:#dc2626; }
  .mini-badge.hour2 { background:#7c3aed; }
  .tags-col { flex:0 0 110px; display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  .tag-pill { font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; color:#fff; }
  .items { flex:1 1 auto; display:flex; flex-direction:column; gap:10px; }
  .meeting-name { font-size:12px; color:#6b7280; font-weight:600; margin-bottom:2px; }
  .item-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; }
  .title { flex:1 1 320px; font-size:14px; color:#111827; }
  .avatars { flex:0 0 auto; display:flex; gap:-4px; }
  .avatar { width:28px; height:28px; border-radius:50%; border:2px solid #fff; margin-left:-8px; object-fit:cover; cursor:default; position:relative; }
  .avatar:first-child { margin-left:0; }
  .match-glow { box-shadow:0 0 0 2px #fbbf24; border-radius:6px; }
  .empty { text-align:center; color:#9ca3af; padding:40px; font-size:14px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Journal Growth — Vibe Session Agenda</h1>
    <div class="sub">Synced from Confluence · v364 · 2026-09-03</div>
  </div>
  <a class="edit-btn" href="https://confluence.frontiersin.net/pages/viewpage.action?pageId=637566996" target="_blank" rel="noopener">Edit on Confluence ↗</a>
</header>
<div class="banner">Source of truth: this page mirrors the Confluence Vibe Session planning table and is regenerated daily. Edits belong on Confluence, not here.</div>
<div class="filterbar">
  <input type="text" id="search" placeholder="Search sessions, topics, presenters...">
  <button class="chip active" data-tag="All">All</button>
  <button class="chip" data-tag="RTM">RTM</button>
  <button class="chip" data-tag="DEO">DEO</button>
  <button class="chip" data-tag="AHM">AHM</button>
  <button class="chip" data-tag="Service Layer">Service Layer</button>
  <button class="chip" data-tag="JANE">JANE</button>
</div>
<main id="main"></main>
<script>
const SESSIONS = [{"date": "2026-09-04", "dayLabel": "", "meeting_name": "Journal Growth: RTM/DEO Rebuild", "is_adhoc": false, "is_2hour": false, "items": [{"text": "Review UI feedback and progress (DEO)", "tags": ["DEO"], "presenters": []}]}, {"date": "2026-09-04", "dayLabel": "", "meeting_name": "Perfect Email - Vibe Session", "is_adhoc": false, "is_2hour": false, "items": [{"text": "Business Update", "tags": ["Other"], "presenters": []}, {"text": "Direct Manuscript Commissioning test & pilot", "tags": ["Other"], "presenters": []}]}, {"date": "2026-09-09", "dayLabel": "", "meeting_name": "Journal Growth: RTM/DEO Rebuild", "is_adhoc": false, "is_2hour": false, "items": [{"text": "CC Journey - Perfect Email (Milena, Jamie)", "tags": ["Other"], "presenters": []}, {"text": "CC Journey Manager (Mati, Alex, Sarah, Juan)", "tags": ["Other"], "presenters": []}]}, {"date": "2026-09-11", "dayLabel": "", "meeting_name": "Journal Growth: RTM/DEO Rebuild", "is_adhoc": false, "is_2hour": false, "items": [{"text": "Case Processing Agent (Mati, Alex)", "tags": ["Other"], "presenters": []}]}, {"date": "2026-09-11", "dayLabel": "", "meeting_name": "Perfect Email - Vibe Session", "is_adhoc": false, "is_2hour": false, "items": [{"text": "Conversion rates and volumes update (including Internal audience campaigns) - Courtney and Sofi + Hitesh for review", "tags": ["Other"], "presenters": []}, {"text": "CC journey with Perfect Email example content - Courtney, Milena, Jamie", "tags": ["Other"], "presenters": []}, {"text": "Manuscript commissioning campaigns: launch update and email examples - Courtney", "tags": ["Other"], "presenters": []}]}, {"date": "2026-09-16", "dayLabel": "", "meeting_name": "Journal Growth: RTM/DEO Rebuild", "is_adhoc": false, "is_2hour": false, "items": [{"text": "Pilot plan (DEO)", "tags": ["DEO"], "presenters": []}]}];
const PHOTOS = {};
const TAG_COLORS = {"RTM": "#0ea5e9", "DEO": "#f59e0b", "AHM": "#8b5cf6", "Service Layer": "#10b981", "JANE": "#ec4899", "Other": "#6b7280"};

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function monthKey(d){ const dt=new Date(d+'T00:00:00'); return dt.toLocaleString('en-US',{month:'long',year:'numeric'}); }

function render(filterTag, query){
  const main = document.getElementById('main');
  main.innerHTML = '';
  const q = (query||'').trim().toLowerCase();
  const groups = {};
  SESSIONS.forEach(s => {
    const mk = monthKey(s.date);
    if(!groups[mk]) groups[mk] = [];
    groups[mk].push(s);
  });
  const monthKeys = Object.keys(groups);
  if(monthKeys.length === 0){
    main.innerHTML = '<div class="empty">No upcoming sessions found.</div>';
    return;
  }
  let anyRendered = false;
  monthKeys.forEach(mk => {
    const monthDiv = document.createElement('div');
    monthDiv.className = 'month-group';
    const header = document.createElement('div');
    header.className = 'month-header';
    header.innerHTML = '<span class="chev">▾</span><span>' + mk + '</span>';
    const bodyDiv = document.createElement('div');
    bodyDiv.className = 'month-body';
    header.onclick = () => {
      header.classList.toggle('collapsed');
      bodyDiv.classList.toggle('collapsed');
    };
    let monthHasContent = false;
    groups[mk].forEach(s => {
      const visibleItems = s.items.filter(it => {
        const tagMatch = filterTag === 'All' || it.tags.includes(filterTag);
        if(!tagMatch) return false;
        if(!q) return true;
        const hay = (it.text + ' ' + it.presenters.join(' ') + ' ' + s.meeting_name).toLowerCase();
        return hay.includes(q);
      });
      if(visibleItems.length === 0) return;
      monthHasContent = true; anyRendered = true;
      const dt = new Date(s.date+'T00:00:00');
      const dow = dt.toLocaleString('en-US',{weekday:'short'});
      const dom = dt.getDate();
      const card = document.createElement('div');
      card.className = 'card';
      const allTags = Array.from(new Set(visibleItems.flatMap(it=>it.tags)));
      let badgesHtml = '';
      if(s.is_adhoc) badgesHtml += '<span class="mini-badge adhoc">Ad-hoc</span>';
      if(s.is_2hour) badgesHtml += '<span class="mini-badge hour2">2h</span>';
      card.innerHTML = `
        <div class="date-badge">
          <div class="dow">${dow}</div>
          <div class="dom">${dom}</div>
          <div class="badges-row">${badgesHtml}</div>
        </div>
        <div class="tags-col">${allTags.map(t=>`<span class="tag-pill" style="background:${TAG_COLORS[t]||'#6b7280'}">${esc(t)}</span>`).join('')}</div>
        <div class="items">
          <div class="meeting-name">${esc(s.meeting_name)}</div>
        </div>`;
      const itemsDiv = card.querySelector('.items');
      visibleItems.forEach(it => {
        const row = document.createElement('div');
        row.className = 'item-row';
        const isMatch = q && (it.text.toLowerCase().includes(q) || it.presenters.join(' ').toLowerCase().includes(q));
        row.innerHTML = `<div class="title${isMatch?' match-glow':''}">${esc(it.text)}</div>
          <div class="avatars">${it.presenters.map(p=>`<img class="avatar" src="${PHOTOS[p]||''}" title="${esc(p)}" alt="${esc(p)}">`).join('')}</div>`;
        itemsDiv.appendChild(row);
      });
      bodyDiv.appendChild(card);
    });
    if(monthHasContent){
      monthDiv.appendChild(header);
      monthDiv.appendChild(bodyDiv);
      main.appendChild(monthDiv);
    }
  });
  if(!anyRendered){
    main.innerHTML = '<div class="empty">No sessions match your filter.</div>';
  }
}

let currentTag = 'All';
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    currentTag = chip.dataset.tag;
    render(currentTag, document.getElementById('search').value);
  });
});
document.getElementById('search').addEventListener('input', (e) => {
  render(currentTag, e.target.value);
});

render('All', '');
</script>
</body>
</html>
