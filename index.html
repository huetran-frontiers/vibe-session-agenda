const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function tagClass(t){ return "tag-" + t.replace(/\s+/g,""); }
function avatar(name){
  const src = PHOTOS[name] || "";
  return `<span class="av"><img src="${src}" alt="${name}"><span class="tip">${name}</span></span>`;
}
function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  const groups = {};
  SESSIONS.forEach(s=>{
    const d = new Date(s.date+"T00:00:00");
    const key = d.getFullYear()+"-"+d.getMonth();
    (groups[key] = groups[key] || {label: MONTHS[d.getMonth()]+" "+d.getFullYear(), items: []}).items.push(s);
  });
  Object.keys(groups).sort().forEach(k=>{
    const g = groups[k];
    const mo = document.createElement("div"); mo.className="month";
    const mh = document.createElement("div"); mh.className="month-head";
    mh.innerHTML = `<span class="chev">▼</span> ${g.label}`;
    mh.onclick = ()=> mo.classList.toggle("collapsed");
    const mb = document.createElement("div"); mb.className="month-body";
    g.items.forEach(s=>{
      const d = new Date(s.date+"T00:00:00");
      const card = document.createElement("div"); card.className="card"; card.dataset.session="1";
      let flags = "";
      if(s.is_adhoc) flags += `<span class="sflag flag-adhoc">📌 Ad-hoc</span>`;
      if(s.is_2hour) flags += `<span class="sflag flag-2h">⏱️ 2h</span>`;
      let itemsHtml = "";
      s.items.forEach(it=>{
        const tags = it.tags.map(t=>`<span class="tag ${tagClass(t)}">${t}</span>`).join("");
        const avs = it.presenters.map(avatar).join("");
        itemsHtml += `<div class="item" data-tags="${it.tags.join("|")}" data-text="${(it.text+" "+it.presenters.join(" ")).replace(/"/g,'&quot;').toLowerCase()}">
          <div class="tagcol">${tags}</div>
          <div class="itembody"><div class="title">${it.text}</div><div class="avatars">${avs}</div></div>
        </div>`;
      });
      card.innerHTML = `
        <div class="datebadge">
          <div class="dow">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]}</div>
          <div class="day">${d.getDate()}</div>
          <div class="mon">${MONTHS[d.getMonth()].slice(0,3)}</div>
        </div>
        <div class="content">
          <div class="mtname">${s.meeting_name}${flags}</div>
          ${itemsHtml}
        </div>`;
      mb.appendChild(card);
    });
    mo.appendChild(mh); mo.appendChild(mb); app.appendChild(mo);
  });
  applyFilter();
}
let activeFilter="all";
function applyFilter(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  document.querySelectorAll(".item").forEach(it=>{
    const tags = (it.dataset.tags||"").split("|");
    const txt = it.dataset.text||"";
    const okTag = activeFilter==="all" || tags.includes(activeFilter);
    const okQ = !q || txt.includes(q);
    it.classList.toggle("hidden", !(okTag && okQ));
    it.classList.toggle("match", q && okQ && txt.includes(q));
  });
  document.querySelectorAll('[data-session]').forEach(card=>{
    const anyVisible = card.querySelectorAll(".item:not(.hidden)").length>0;
    card.classList.toggle("hidden", !anyVisible);
  });
  document.querySelectorAll(".month").forEach(mo=>{
    const anyVisible = mo.querySelectorAll('.card:not(.hidden)').length>0;
    mo.classList.toggle("hidden", !anyVisible);
  });
}
document.querySelectorAll(".fbtn").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll(".fbtn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); activeFilter=b.dataset.f; applyFilter();
  };
});
document.getElementById("search").addEventListener("input", applyFilter);
render();
</script>
</body>
</html>
