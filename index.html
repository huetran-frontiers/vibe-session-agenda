<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const MONTHS_SHORT=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const MONTHS_LONG=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TAG_CLASS={'RTM':'tag-RTM','DEO':'tag-DEO','AHM':'tag-AHM','Service Layer':'tag-Service','JANE':'tag-JANE','Other':'tag-Other'};

function render(){
  const root=document.getElementById('root'); root.innerHTML='';
  if(!DATA.sessions.length){root.innerHTML='<div class="empty">No upcoming sessions.</div>';return;}
  const groups={};
  DATA.sessions.forEach(s=>{const d=new Date(s.date+'T00:00:00');const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');(groups[k]=groups[k]||[]).push(s);});
  Object.keys(groups).sort().forEach(k=>{
    const [y,m]=k.split('-');const grp=document.createElement('div');grp.className='month-group';
    grp.innerHTML=`<div class="month-header"><span>${MONTHS_LONG[+m-1]} ${y} · ${groups[k].length} session${groups[k].length>1?'s':''}</span><span class="chev">▼</span></div><div class="month-body"></div>`;
    const body=grp.querySelector('.month-body');
    grp.querySelector('.month-header').onclick=()=>grp.classList.toggle('collapsed');
    groups[k].forEach(s=>{
      const d=new Date(s.date+'T00:00:00');
      s.items.forEach(it=>{
        const div=document.createElement('div');div.className='session';
        div.dataset.tags=it.tags.join('|');
        div.dataset.search=(it.text+' '+it.presenters.join(' ')).toLowerCase();
        const avatars=it.presenters.map(p=>{const url=DATA.photos[p]||'';return `<div class="avatar" data-name="${p}" style="background-image:url('${url}')"></div>`;}).join('');
        const tags=it.tags.map(t=>`<span class="tag ${TAG_CLASS[t]||'tag-Other'}">${t}</span>`).join('');
        div.innerHTML=`<div class="date-badge"><div class="day">${d.getDate()}</div><div class="mon">${MONTHS_SHORT[d.getMonth()]}</div><div class="dow">${DOW[d.getDay()]}</div></div><div class="tags-col">${tags}</div><div class="item-body"><div class="title">${it.text}</div><div class="avatars">${avatars}</div></div>`;
        body.appendChild(div);
      });
    });
    root.appendChild(grp);
  });
}

let activeFilter='all';
function applyFilters(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  document.querySelectorAll('.session').forEach(s=>{
    const tags=s.dataset.tags.split('|');
    const tagMatch=activeFilter==='all'||tags.includes(activeFilter);
    const textMatch=!q||s.dataset.search.includes(q);
    s.classList.toggle('hidden',!(tagMatch&&textMatch));
    s.classList.toggle('glow',!!q&&textMatch);
  });
  document.querySelectorAll('.month-group').forEach(g=>{
    const any=Array.from(g.querySelectorAll('.session')).some(s=>!s.classList.contains('hidden'));
    g.style.display=any?'':'none';
  });
}
render();
document.querySelectorAll('.filter-btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');activeFilter=b.dataset.f;applyFilters();
});
document.getElementById('q').oninput=applyFilters;
</script>
