const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let activeTag = 'All';
let query = '';

function tagClass(t) { return 'tag tag-' + t.replace(/\s+/g,''); }

function render() {
  const main = document.getElementById('main');
  const groups = {};
  SESSIONS.forEach(s => {
    const items = s.items.filter(it => {
      const tagOk = activeTag === 'All' || it.tags.includes(activeTag);
      if (!tagOk) return false;
      if (!query) return true;
      const q = query.toLowerCase();
      return it.text.toLowerCase().includes(q) || it.presenters.some(p => p.toLowerCase().includes(q));
    });
    if (!items.length) return;
    const d = new Date(s.date + 'T00:00:00');
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    const label = MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    if (!groups[key]) groups[key] = { label, sessions: [] };
    groups[key].sessions.push({ s, items, d });
  });
  if (!Object.keys(groups).length) {
    main.innerHTML = '<div class="empty">No sessions match your filters.</div>';
    return;
  }
  main.innerHTML = Object.keys(groups).sort().map(key => {
    const g = groups[key];
    return '<div class="month"><div class="month-header" onclick="this.parentNode.classList.toggle(\'collapsed\')"><span class="caret">▼</span>' + g.label + '</div>' +
      g.sessions.map(({s, items, d}) => {
        const allTags = [...new Set(items.flatMap(it => it.tags))];
        const flags = [];
        if (s.is_adhoc) flags.push('<span class="flag flag-adhoc">Ad-hoc</span>');
        if (s.is_2hour) flags.push('<span class="flag flag-2h">2h</span>');
        return '<div class="session">' +
          '<div class="date-badge"><div class="day">' + DAYS[d.getDay()] + '</div><div class="num">' + d.getDate() + '</div><div class="mon">' + MONTHS[d.getMonth()].slice(0,3) + '</div>' +
          (flags.length ? '<div class="session-flags">' + flags.join('') + '</div>' : '') + '</div>' +
          '<div class="tags-col">' + allTags.map(t => '<span class="' + tagClass(t) + '">' + t + '</span>').join('') + '</div>' +
          '<div class="items">' +
            items.map(it => '<div class="item"><div class="item-body">' +
              '<div class="title">' + escapeHtml(it.text) + '</div>' +
              '<div class="avatars">' + it.presenters.map(p => {
                const src = PHOTOS[p] || '';
                const glow = query && p.toLowerCase().includes(query.toLowerCase()) ? ' glow' : '';
                return '<img class="avatar' + glow + '" src="' + src + '" alt="' + escapeHtml(p) + '" title="' + escapeHtml(p) + '">';
              }).join('') + '</div>' +
            '</div></div>').join('') +
          '</div></div>';
      }).join('') + '</div>';
  }).join('');
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

document.querySelectorAll('.filter').forEach(b => b.onclick = () => {
  document.querySelectorAll('.filter').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); activeTag = b.dataset.tag; render();
});
document.getElementById('search').oninput = e => { query = e.target.value.trim(); render(); };
render();
</script>
</body>
</html>
